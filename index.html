<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e9df">
  <title>Happy Birthday Hira 🎂</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7f1;
      color: #29205e;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { padding: 22px 16px 10px; text-align: center; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 500; }
    p { margin: 8px 0 18px; color: #6d5686; }
    main { width: min(1200px, 100%); padding: 0 12px 24px; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(69, 39, 83, .13);
    }
    footer { padding: 0 16px 24px; text-align: center; color: #6d5686; }
  </style>
</head>
<body>
  <header>
    <h1>Happy Birthday, Hira! ♡</h1>
    <p>A special birthday story, with warm wishes from Ahmad Raza.</p>
  </header>
  <main>
    <img src="birthday-story.png" alt="A dreamy three-panel birthday story for Hira, with childhood dreams, a psychology graduation, and a birthday cake marked HBD Hira and 23.">
  </main>
  <footer>Wishing you happiness, peace, and beautiful moments ahead. ♡</footer>
</body>
</html>
